<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book shape -->
  <rect x="40" y="30" width="120" height="140" fill="url(#grad1)" rx="5"/>
  <rect x="45" y="35" width="10" height="130" fill="#2980b9" opacity="0.3"/>

  <!-- Pages effect -->
  <rect x="55" y="35" width="100" height="130" fill="white" opacity="0.1"/>
  <line x1="55" y1="45" x2="155" y2="45" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="55" y1="55" x2="155" y2="55" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="55" y1="65" x2="155" y2="65" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- Letter B -->
  <text x="100" y="120" font-size="80" font-family="Arial, sans-serif" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
