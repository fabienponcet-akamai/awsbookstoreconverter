apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/awsbookstoreconverter.git  # CHANGEME
    targetRevision: HEAD
    path: kubernetes/base/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # This depends on Prometheus, Grafana, Loki being installed first
  info:
    - name: 'Prerequisites'
      value: 'Requires kube-prometheus-stack, Loki, and Jaeger operator installed via APL bootstrap'
