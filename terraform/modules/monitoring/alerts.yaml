apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookstore-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: bookstore-api
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (sum(rate(http_requests_total{namespace="bookstore",status=~"5.."}[5m]))
             / sum(rate(http_requests_total{namespace="bookstore"}[5m]))) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value | humanizePercentage }} for namespace bookstore"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{namespace="bookstore"}[5m])) by (le, service)
            ) > 1.0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected"
            description: "P95 latency is {{ $value }}s for {{ $labels.service }}"

        - alert: ServiceDown
          expr: |
            up{namespace="bookstore"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service is down"
            description: "{{ $labels.job }} in namespace {{ $labels.namespace }} is down"

    - name: bookstore-postgres
      interval: 30s
      rules:
        - alert: PostgreSQLDown
          expr: |
            pg_up{namespace="bookstore"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL cluster {{ $labels.cluster }} is down"

        - alert: PostgreSQLHighConnections
          expr: |
            (pg_stat_database_numbackends / pg_settings_max_connections) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection usage high"
            description: "Connection usage is {{ $value | humanizePercentage }} on {{ $labels.cluster }}"

        - alert: PostgreSQLReplicationLag
          expr: |
            pg_replication_lag{namespace="bookstore"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replication lag"
            description: "Replication lag is {{ $value }}s on {{ $labels.cluster }}"

    - name: bookstore-knative
      interval: 30s
      rules:
        - alert: KnativeServiceScaledToZero
          expr: |
            sum(kube_deployment_status_replicas_available{namespace="bookstore"}) by (deployment) == 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Knative service scaled to zero"
            description: "{{ $labels.deployment }} has been scaled to zero for 10 minutes"

        - alert: KnativeServiceColdStartHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(queue_request_duration_seconds_bucket{namespace="bookstore"}[5m])) by (le, service)
            ) > 5.0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High cold start time"
            description: "P95 cold start time is {{ $value }}s for {{ $labels.service }}"
