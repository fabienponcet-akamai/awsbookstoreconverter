apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-event-router
  namespace: bookstore
  labels:
    app: bookstore
    component: outbox-event-router
    tier: workers
spec:
  replicas: 2  # Run 2 instances for high availability (SKIP LOCKED prevents conflicts)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bookstore
      component: outbox-event-router
  template:
    metadata:
      labels:
        app: bookstore
        component: outbox-event-router
        tier: workers
      annotations:
        prometheus.io/scrape: "false"  # Can add Prometheus metrics later
    spec:
      serviceAccountName: bookstore-api

      containers:
      - name: router
        image: bookstore-api:latest  # Same image as API, different entry point
        imagePullPolicy: Always

        command: ["node"]
        args: ["dist/workers/index.js"]

        env:
        # Managed DBaaS connection (source of outbox events)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-db-credentials
              key: connection-string

        # Neo4j connection (for recommendations)
        - name: NEO4J_URI
          value: "bolt://bookstore-graph:7687"

        - name: NEO4J_USERNAME
          value: "neo4j"

        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-credentials
              key: password

        # Redis connection (for bestsellers)
        - name: REDIS_URL
          value: "redis://bookstore-redis-cluster.bookstore.svc.cluster.local:6379"

        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
              optional: true

        # OpenSearch connection (for full-text search)
        - name: OPENSEARCH_URL
          value: "https://bookstore-search-master.bookstore.svc.cluster.local:9200"

        - name: OPENSEARCH_USER
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: username
              optional: true

        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: password
              optional: true

        # Worker configuration
        - name: NODE_ENV
          value: "production"

        - name: LOG_LEVEL
          value: "info"

        - name: ENABLE_HEALTH_CHECK
          value: "true"

        - name: HEALTH_CHECK_PORT
          value: "8080"

        - name: POLL_INTERVAL_MS
          value: "1000"  # Poll every 1 second

        resources:
          requests:
            memory: "512Mi"  # More memory for multiple handlers
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        ports:
        - name: health
          containerPort: 8080
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 30

      # Pod anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - outbox-event-router
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-event-router
  namespace: bookstore
  labels:
    app: bookstore
    component: outbox-event-router
spec:
  selector:
    app: bookstore
    component: outbox-event-router
  ports:
  - name: health
    port: 8080
    targetPort: health
    protocol: TCP
  - name: stats
    port: 8081
    targetPort: health
    protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-event-router
  namespace: bookstore
spec:
  minAvailable: 1  # Always keep at least 1 instance running
  selector:
    matchLabels:
      app: bookstore
      component: outbox-event-router
