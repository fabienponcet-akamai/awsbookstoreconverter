apiVersion: v1
kind: Secret
metadata:
  name: object-storage-credentials
  namespace: bookstore
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual Linode Object Storage credentials
  # You can get these from Linode Cloud Manager > Object Storage > Access Keys

  access-key: "CHANGEME_ACCESS_KEY"
  secret-key: "CHANGEME_SECRET_KEY"

  # Example values (DO NOT USE IN PRODUCTION):
  # access-key: "AKIAIOSFODNN7EXAMPLE"
  # secret-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

---
# For production, use Sealed Secrets instead:
#
# 1. Install kubeseal:
#    wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/kubeseal-0.24.0-linux-amd64.tar.gz
#    tar xfz kubeseal-0.24.0-linux-amd64.tar.gz
#    sudo install -m 755 kubeseal /usr/local/bin/kubeseal
#
# 2. Create and seal the secret:
#    kubectl create secret generic object-storage-credentials \
#      --from-literal=access-key="YOUR_ACCESS_KEY" \
#      --from-literal=secret-key="YOUR_SECRET_KEY" \
#      -n bookstore \
#      --dry-run=client -o yaml | \
#      kubeseal -o yaml > object-storage-secret-sealed.yaml
#
# 3. Commit the sealed secret to Git (it's encrypted!)
#    git add object-storage-secret-sealed.yaml
#    git commit -m "Add sealed object storage credentials"
