apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
  # ServiceMonitors for Prometheus scraping
  - servicemonitors/knative-services.yaml
  # PodMonitors for PostgreSQL
  - podmonitors/postgres-clusters.yaml
  # PrometheusRules for alerts
  - prometheusrules/alerts.yaml
  # Loki configuration
  - loki-config.yaml
  # Jaeger + OpenTelemetry
  - jaeger-config.yaml

# Dashboards are deployed to monitoring namespace
# They need to be applied separately
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/bookstore-overview.yaml

commonLabels:
  app.kubernetes.io/part-of: bookstore
  app.kubernetes.io/component: monitoring
  app.kubernetes.io/managed-by: kustomize
