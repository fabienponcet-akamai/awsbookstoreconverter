---
# PodMonitor for CloudNative-PG main cluster
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bookstore-main-db
  namespace: bookstore
  labels:
    app: bookstore
    component: database
spec:
  selector:
    matchLabels:
      postgresql: bookstore-main
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
