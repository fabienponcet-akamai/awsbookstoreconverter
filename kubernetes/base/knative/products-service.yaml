apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: products-api
  namespace: bookstore
  labels:
    app: bookstore
    component: products-api
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration
        autoscaling.knative.dev/min-scale: "0"  # Scale to zero
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/target: "100"  # Target 100 concurrent requests per pod
        autoscaling.knative.dev/metric: "concurrency"
        # Timeout
        autoscaling.knative.dev/scale-down-delay: "30s"
      labels:
        app: bookstore
        component: products-api
        version: v1
    spec:
      containerConcurrency: 100
      containers:
      - name: products-api
        image: bookstore-api:latest
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "products"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-main
        - name: SEARCH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-search
        - name: GRAPH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-graph
        - name: REDIS_HOST
          value: "redis.bookstore.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: KEYCLOAK_URL
          value: "http://keycloak.bookstore.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "bookstore"
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-id
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      timeoutSeconds: 300
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-api-secrets
  namespace: bookstore
type: Opaque
stringData:
  # Main database (products, cart, orders, users)
  database-url-main: "postgresql://bookstore:changeme@bookstore-main-rw.bookstore.svc.cluster.local:5432/bookstore"
  # Search database (full-text search)
  database-url-search: "postgresql://bookstore:changeme@bookstore-search-rw.bookstore.svc.cluster.local:5432/bookstore_search"
  # Graph database (recommendations)
  database-url-graph: "postgresql://bookstore:changeme@bookstore-graph-rw.bookstore.svc.cluster.local:5432/bookstore_graph"
  keycloak-client-id: "bookstore-api"
  keycloak-client-secret: "changeme-client-secret"
  jwt-secret: "changeme-jwt-secret"
