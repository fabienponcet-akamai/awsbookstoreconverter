apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orders-api
  namespace: bookstore
  labels:
    app: bookstore
    component: orders-api
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration
        autoscaling.knative.dev/min-scale: "0"  # Scale to zero
        autoscaling.knative.dev/max-scale: "15"  # Higher for orders (critical service)
        autoscaling.knative.dev/target: "80"   # Target 80 concurrent requests (lower = more pods)
        autoscaling.knative.dev/metric: "concurrency"
        # Timeout
        autoscaling.knative.dev/scale-down-delay: "60s"  # Keep alive longer
      labels:
        app: bookstore
        component: orders-api
        version: v1
    spec:
      containerConcurrency: 80
      containers:
      - name: orders-api
        image: ${CONTAINER_REGISTRY}/bookstore-api:${IMAGE_TAG}
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "orders"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-main
        - name: GRAPH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-graph
        - name: KEYCLOAK_URL
          value: "http://keycloak.bookstore.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "bookstore"
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-id
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-secret
        resources:
          requests:
            memory: "512Mi"  # More memory for orders processing
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      timeoutSeconds: 600  # Longer timeout for order processing
