apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: recommendations-api
  namespace: bookstore
  labels:
    app: bookstore
    component: recommendations-api
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration
        autoscaling.knative.dev/min-scale: "0"  # Scale to zero
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/metric: "concurrency"
        # Timeout
        autoscaling.knative.dev/scale-down-delay: "30s"
      labels:
        app: bookstore
        component: recommendations-api
        version: v1
    spec:
      containerConcurrency: 100
      containers:
      - name: recommendations-api
        image: ${CONTAINER_REGISTRY}/bookstore-api:${IMAGE_TAG}
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "recommendations"
        - name: GRAPH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-graph
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: database-url-main
        - name: KEYCLOAK_URL
          value: "http://keycloak.bookstore.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "bookstore"
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-id
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bookstore-api-secrets
              key: keycloak-client-secret
        resources:
          requests:
            memory: "512Mi"  # More memory for graph queries
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "750m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      timeoutSeconds: 300
