apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookstore-search
  namespace: bookstore
  labels:
    app: bookstore
    database-type: search
spec:
  instances: 2

  # PostgreSQL configuration optimized for full-text search
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "6553kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      max_worker_processes: "4"
      max_parallel_workers_per_gather: "2"
      max_parallel_workers: "4"
    pg_hba:
      - host all all all scram-sha-256

    # Enable extensions for full-text search
    shared_preload_libraries:
      - pg_stat_statements

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: bookstore_search
      owner: bookstore
      secret:
        name: bookstore-search-credentials
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;
        - CREATE EXTENSION IF NOT EXISTS unaccent;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  # Storage configuration
  storage:
    size: 15Gi
    storageClass: linode-block-storage-retain

  # Backup configuration
  backup:
    barmanObjectStore:
      destinationPath: s3://bookstore-backups/postgres-search
      s3Credentials:
        accessKeyId:
          name: linode-object-storage-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: linode-object-storage-credentials
          key: SECRET_ACCESS_KEY
      endpointURL: https://us-east-1.linodeobjects.com
      wal:
        compression: gzip
    retentionPolicy: "30d"

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Resources optimized for search workloads
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Replication for read scaling
  replicationSlots:
    highAvailability:
      enabled: true
    updateInterval: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-search-credentials
  namespace: bookstore
type: kubernetes.io/basic-auth
stringData:
  username: bookstore
  password: changeme-search-password
