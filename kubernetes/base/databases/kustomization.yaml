apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
  - postgres-cluster.yaml    # Main database (products, cart, orders, users)
  - postgres-search.yaml     # Search database (replaces Elasticsearch)
  - postgres-graph.yaml      # Graph database (replaces Neptune)
  - redis.yaml               # Cache and leaderboard

commonLabels:
  app.kubernetes.io/part-of: bookstore
  app.kubernetes.io/managed-by: kustomize
