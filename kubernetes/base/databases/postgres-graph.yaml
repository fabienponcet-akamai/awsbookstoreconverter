apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookstore-graph
  namespace: bookstore
  labels:
    app: bookstore
    database-type: graph
spec:
  instances: 2

  # PostgreSQL configuration for graph database
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "6553kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      # Optimizations for graph queries
      join_collapse_limit: "1"
      from_collapse_limit: "1"
    pg_hba:
      - host all all all scram-sha-256

  # Standard PostgreSQL image (no custom extensions required)
  imageName: postgres:15

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: bookstore_graph
      owner: bookstore
      secret:
        name: bookstore-graph-credentials
      postInitApplicationSQL:
        - |
          -- Standard PostgreSQL extensions for recommendation system
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";

  # Storage configuration
  storage:
    size: 10Gi
    storageClass: linode-block-storage-retain

  # Backup configuration
  backup:
    barmanObjectStore:
      destinationPath: s3://bookstore-backups/postgres-graph
      s3Credentials:
        accessKeyId:
          name: linode-object-storage-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: linode-object-storage-credentials
          key: SECRET_ACCESS_KEY
      endpointURL: https://us-east-1.linodeobjects.com
      wal:
        compression: gzip
    retentionPolicy: "30d"

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Resources
  resources:
    requests:
      memory: "768Mi"
      cpu: "500m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-graph-credentials
  namespace: bookstore
type: kubernetes.io/basic-auth
stringData:
  username: bookstore
  password: changeme-graph-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-graph-init
  namespace: bookstore
data:
  init-graph.sql: |
    -- Relational Recommendation Database Initialization
    -- Standard PostgreSQL schema for collaborative filtering

    -- This initialization is handled by the migration files
    -- This ConfigMap is kept for compatibility but can be removed
    SELECT 1;
