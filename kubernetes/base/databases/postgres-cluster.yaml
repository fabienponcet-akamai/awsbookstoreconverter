apiVersion: v1
kind: Namespace
metadata:
  name: bookstore
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookstore-postgres
  namespace: bookstore
spec:
  instances: 3

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: bookstore
      owner: bookstore
      secret:
        name: bookstore-postgres-credentials

  # Storage configuration
  storage:
    size: 20Gi
    storageClass: linode-block-storage-retain

  # Backup configuration
  backup:
    barmanObjectStore:
      destinationPath: s3://bookstore-backups/postgres
      s3Credentials:
        accessKeyId:
          name: linode-object-storage-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: linode-object-storage-credentials
          key: SECRET_ACCESS_KEY
      endpointURL: https://us-east-1.linodeobjects.com
      wal:
        compression: gzip
    retentionPolicy: "30d"

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-postgres-credentials
  namespace: bookstore
type: kubernetes.io/basic-auth
stringData:
  username: bookstore
  password: changeme-secure-password-here
---
apiVersion: v1
kind: Secret
metadata:
  name: linode-object-storage-credentials
  namespace: bookstore
type: Opaque
stringData:
  ACCESS_KEY_ID: "your-access-key-id"
  SECRET_ACCESS_KEY: "your-secret-access-key"
