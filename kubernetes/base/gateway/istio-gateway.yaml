apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: bookstore-gateway
  namespace: bookstore
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "bookstore.example.com"
    - "*.bookstore.example.com"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: bookstore-tls-cert
    hosts:
    - "bookstore.example.com"
    - "*.bookstore.example.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bookstore-api
  namespace: bookstore
spec:
  hosts:
  - "api.bookstore.example.com"
  gateways:
  - bookstore-gateway
  http:
  - match:
    - uri:
        prefix: "/api/v1"
    route:
    - destination:
        host: bookstore-api.bookstore.svc.cluster.local
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
    corsPolicy:
      allowOrigins:
      - exact: "https://bookstore.example.com"
      - regex: "https://.*\\.bookstore\\.example\\.com"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-requested-with
      allowCredentials: true
      maxAge: "24h"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bookstore-frontend
  namespace: bookstore
spec:
  hosts:
  - "bookstore.example.com"
  gateways:
  - bookstore-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: bookstore-frontend.bookstore.svc.cluster.local
        port:
          number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bookstore-api
  namespace: bookstore
spec:
  host: bookstore-api.bookstore.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
