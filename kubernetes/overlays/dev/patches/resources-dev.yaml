# Resource patches for development environment
# Lower resource requests for cost savings in dev

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: products-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"  # Lower max for dev
    spec:
      containers:
        - name: products-api
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cart-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containers:
        - name: cart-api
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: serving.knative.dev/v1
