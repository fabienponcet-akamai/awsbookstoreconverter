apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-gitea-sa
  namespace: bookstore
  labels:
    app.kubernetes.io/component: tekton
    app.kubernetes.io/created-by: apl-core
secrets:
- name: gitea-credentials
- name: object-storage-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-gitea-role
  namespace: bookstore
  labels:
    app.kubernetes.io/component: tekton
    app.kubernetes.io/created-by: apl-core
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "secrets", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["tekton.dev"]
  resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["triggers.tekton.dev"]
  resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-gitea-binding
  namespace: bookstore
  labels:
    app.kubernetes.io/component: tekton
    app.kubernetes.io/created-by: apl-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-gitea-role
subjects:
- kind: ServiceAccount
  name: tekton-gitea-sa
  namespace: bookstore
