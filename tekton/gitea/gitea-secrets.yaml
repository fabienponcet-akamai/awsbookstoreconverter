apiVersion: v1
kind: Secret
metadata:
  name: gitea-credentials
  namespace: bookstore
  annotations:
    # This annotation tells Tekton this secret contains Git credentials
    tekton.dev/git-0: http://gitea.gitea.svc.cluster.local:3000
type: kubernetes.io/basic-auth
stringData:
  username: gitea_admin  # Change to your Gitea username
  password: CHANGEME_GITEA_TOKEN  # Create token in Gitea Settings → Applications → Generate Token

---
# Webhook secret for validating Gitea webhook requests
apiVersion: v1
kind: Secret
metadata:
  name: gitea-webhook-secret
  namespace: bookstore
type: Opaque
stringData:
  # Generate with: openssl rand -hex 20
  webhook-secret: "CHANGEME_WEBHOOK_SECRET"

---
# Optional: SSH key for Git clone (more secure than token)
# Uncomment and configure if using SSH
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gitea-ssh-key
#   namespace: bookstore
#   annotations:
#     tekton.dev/git-0: gitea.gitea.svc.cluster.local
# type: kubernetes.io/ssh-auth
# stringData:
#   ssh-privatekey: |
#     -----BEGIN OPENSSH PRIVATE KEY-----
#     CHANGEME_SSH_PRIVATE_KEY
#     -----END OPENSSH PRIVATE KEY-----
#   known_hosts: |
#     gitea.gitea.svc.cluster.local ssh-rsa AAAA...

---
# For production, use Sealed Secrets:
#
# 1. Install kubeseal CLI
# 2. Create secret and seal it:
#
# kubectl create secret generic gitea-credentials \
#   --from-literal=username=gitea_admin \
#   --from-literal=password=YOUR_TOKEN \
#   -n bookstore \
#   --dry-run=client -o yaml | \
#   kubeseal -o yaml > gitea-credentials-sealed.yaml
#
# 3. Commit sealed secret to Git (it's encrypted!)
