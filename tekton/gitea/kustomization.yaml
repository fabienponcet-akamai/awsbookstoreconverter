apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
- gitea-serviceaccount.yaml
- gitea-secrets.yaml
- gitea-eventlistener.yaml
- gitea-triggerbindings.yaml
- gitea-triggertemplates.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: bookstore
    app.kubernetes.io/component: tekton-triggers
    app.kubernetes.io/managed-by: kustomize
