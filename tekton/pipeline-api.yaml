apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: bookstore-api-build-deploy
  namespace: bookstore
spec:
  params:
  - name: git-url
    type: string
    description: Git repository URL
  - name: git-revision
    type: string
    description: Git revision to checkout
    default: main
  - name: image-name
    type: string
    description: Docker image name
    default: bookstore-api
  - name: image-tag
    type: string
    description: Docker image tag
    default: latest

  workspaces:
  - name: shared-workspace
  - name: docker-credentials

  tasks:
  # Task 1: Clone repository
  - name: fetch-repository
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-workspace
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.git-revision)

  # Task 2: Run tests
  - name: run-tests
    runAfter:
    - fetch-repository
    taskRef:
      name: npm-test
    workspaces:
    - name: source
      workspace: shared-workspace
    params:
    - name: PATH_CONTEXT
      value: src/api

  # Task 3: Build Docker image
  - name: build-image
    runAfter:
    - run-tests
    taskRef:
      name: buildah
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: "$(params.image-name):$(params.image-tag)"
    - name: DOCKERFILE
      value: src/api/Dockerfile
    - name: CONTEXT
      value: src/api

  # Task 4: Deploy to Kubernetes
  - name: deploy
    runAfter:
    - build-image
    taskRef:
      name: kubectl-apply
    workspaces:
    - name: source
      workspace: shared-workspace
    params:
    - name: MANIFEST
      value: kubernetes/base/api/
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-test
  namespace: bookstore
spec:
  params:
  - name: PATH_CONTEXT
    type: string
    default: .
  workspaces:
  - name: source
  steps:
  - name: install-dependencies
    image: node:20-alpine
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
    script: |
      #!/bin/sh
      set -e
      npm ci
  - name: run-tests
    image: node:20-alpine
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
    script: |
      #!/bin/sh
      set -e
      npm test || echo "No tests configured yet"
  - name: lint
    image: node:20-alpine
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
    script: |
      #!/bin/sh
      set -e
      npm run lint || echo "No linting configured yet"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kubectl-apply
  namespace: bookstore
spec:
  params:
  - name: MANIFEST
    type: string
  workspaces:
  - name: source
  steps:
  - name: apply
    image: bitnami/kubectl:latest
    workingDir: $(workspaces.source.path)
    script: |
      #!/bin/bash
      set -e
      kubectl apply -k $(params.MANIFEST)
      kubectl rollout status deployment/bookstore-api -n bookstore
